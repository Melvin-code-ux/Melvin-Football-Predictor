name: 🏈 Melvin Predictor - Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ⚡ Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 💾 Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ KEY FIX - Use specific Gradle 8.4
      # Compatible with AGP 8.1.2!
      - name: 🪄 Generate Gradle Wrapper
        run: |
          gradle wrapper \
          --gradle-version 8.4 \
          --distribution-type bin

      - name: 🔧 Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --parallel \
          --build-cache \
          --warning-mode none
        env:
          GRADLE_OPTS: "-Xmx2g -XX:+UseParallelGC"
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 🔍 Verify APK Generated
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "✅ APK verified!"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melvin-Predictor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Build Summary
        run: |
          echo "🏈 MELVIN PREDICTOR BUILD COMPLETE!"
          echo "✅ Download APK from Actions tab!"
