name: 🏈 Melvin Predictor - Build APK

# ─────────────────────────────────────────
# 🚀 TRIGGERS
# ─────────────────────────────────────────
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # ← Allows manual trigger from GitHub UI!

# ─────────────────────────────────────────
# ⚙️ JOBS
# ─────────────────────────────────────────
jobs:
  build:
    name: ⚡ Build Debug APK
    runs-on: ubuntu-latest  # ← Fastest free runner!
    timeout-minutes: 10     # ← Hard stop at 10 min!

    steps:

      # ─────────────────────────────────
      # 📥 STEP 1 - Checkout Code
      # ─────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────
      # ☕ STEP 2 - Setup JDK 17
      # ─────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'  # ← Fastest JDK distribution!
          cache: gradle            # ← Auto caches Gradle! ✅

      # ─────────────────────────────────
      # 💾 STEP 3 - Cache Gradle Files
      # ─────────────────────────────────
      - name: 💾 Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─────────────────────────────────
      # 🔑 STEP 4 - Setup API Key
      # ─────────────────────────────────
      - name: 🔑 Inject API Key
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> local.properties

      # ─────────────────────────────────
      # 🔧 STEP 5 - Make Gradle Executable
      # ─────────────────────────────────
      - name: 🔧 Grant Gradle Execute Permission
        run: chmod +x gradlew

      # ─────────────────────────────────
      # 🏗️ STEP 6 - Build Debug APK
      # ─────────────────────────────────
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug
          --no-daemon
          --parallel
          --build-cache
          --quiet
        env:
          GRADLE_OPTS: "-Xmx2g -XX:+UseParallelGC"

      # ─────────────────────────────────
      # 🔍 STEP 7 - Verify APK Exists
      # ─────────────────────────────────
      - name: 🔍 Verify APK Generated
        run: |
          echo "📦 APK file details:"
          ls -lh app/build/outputs/apk/debug/
          echo "✅ APK verified successfully!"

      # ─────────────────────────────────
      # 📤 STEP 8 - Upload APK Artifact
      # ─────────────────────────────────
      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melvin-Predictor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30   # ← APK stays for 30 days!
          if-no-files-found: error

      # ─────────────────────────────────
      # 🎉 STEP 9 - Build Summary
      # ─────────────────────────────────
      - name: 🎉 Build Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🏈 MELVIN PREDICTOR BUILD COMPLETE!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ APK built successfully"
          echo "  📦 Artifact: Melvin-Predictor-Debug-APK"
          echo "  📅 Retention: 30 days"
          echo "  ⬇️  Download from GitHub Actions tab"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
