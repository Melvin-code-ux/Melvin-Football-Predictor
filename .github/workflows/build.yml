name: 🏈 Melvin Predictor - Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ⚡ Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ KEY FIX - Correct gradlew script!
      - name: 🪄 Create Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper

          # ✅ Correct wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # ✅ Download real wrapper jar
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

          # ✅ Correct gradlew script!
          # Uses -classpath NOT -jar!
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd -P)"
          APP_BASE_NAME="$(basename "$0")"
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"

          # Find java
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          else
              JAVACMD="java"
          fi

          # Run with correct classpath!
          exec "$JAVACMD" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF

          chmod +x gradlew
          echo "✅ Wrapper created!"
          cat gradlew

      - name: 🔍 Verify Wrapper
        run: |
          echo "📁 Wrapper files:"
          ls -la gradle/wrapper/
          echo "📄 gradlew content:"
          cat gradlew

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --parallel \
          --warning-mode none \
          --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -XX:+UseParallelGC"
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 🔍 Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "✅ APK verified!"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melvin-Predictor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Done!
        run: echo "🏈 MELVIN PREDICTOR APK READY TO DOWNLOAD!"
