name: 🏈 Melvin Predictor - Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ⚡ Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ KEY FIX!
      # Manually create wrapper - no system Gradle needed!
      - name: 🪄 Create Gradle Wrapper Manually
        run: |
          mkdir -p gradle/wrapper

          # Create wrapper properties with exact version
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download gradle wrapper jar directly
          curl -o gradle/wrapper/gradle-wrapper.jar \
          https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar

          # Create gradlew script
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          exec java -jar "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" "$@"
          EOF

          chmod +x gradlew
          echo "✅ Wrapper created successfully!"
          ls -la gradle/wrapper/

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --parallel \
          --warning-mode none \
          --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2g -XX:+UseParallelGC"
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 🔍 Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "✅ APK verified!"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melvin-Predictor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🎉 Done!
        run: echo "🏈 MELVIN PREDICTOR APK READY!"
