name: 🏈 Melvin Predictor - Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ⚡ Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🪄 Create Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd -P)"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          if [ -n "$JAVA_HOME" ] ; then
              JAVACMD="$JAVA_HOME/bin/java"
          else
              JAVACMD="java"
          fi
          exec "$JAVACMD" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          EOF
          chmod +x gradlew

      - name: 🔧 Make Gradlew Executable
        run: chmod +x ./gradlew

      # ✅ Show ALL files in repo
      - name: 📁 Show All Project Files
        run: |
          echo "━━━━━━ PROJECT FILES ━━━━━━"
          find app/src -name "*.kt" | sort
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ✅ Build and capture EVERYTHING
      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug \
          --no-daemon \
          --stacktrace \
          --info \
          2>&1 | tee build_log.txt || true

      # ✅ Show ONLY errors
      - name: ❌ Show Kotlin Errors
        if: always()
        run: |
          echo "━━━━━━ KOTLIN ERRORS ━━━━━━"
          grep -n "error:" build_log.txt || echo "No errors found"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "━━━━━━ UNRESOLVED ━━━━━━"
          grep -n "Unresolved\|unresolved" build_log.txt || echo "None"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "━━━━━━ NOT FOUND ━━━━━━"
          grep -n "not found\|Not found" build_log.txt || echo "None"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "━━━━━━ EXCEPTION ━━━━━━"
          grep -n "Exception\|exception" build_log.txt | head -20 || echo "None"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ✅ Upload log as artifact too!
      - name: 📤 Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build_log.txt
          retention-days: 1

      - name: 📤 Upload APK If Exists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melvin-Predictor-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn
